<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b0764" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#sheen)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- download arrow -->
    <path d="M512 200 V590" stroke-width="104"/>
    <path d="M336 420 L512 596 L688 420" stroke-width="104"/>
    <!-- flowing sound wave (the "flow") -->
    <path d="M232 800 q70 -78 140 0 t140 0 t140 0 t140 0" stroke-width="76"/>
  </g>
</svg>
